name: Update Formula

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "PCAPpuller release tag (e.g. v0.4.0)"
        required: true
        type: string
  repository_dispatch:
    types: [pcappuller-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump formula url and sha256
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.event.client_payload.tag }}"
          URL="https://github.com/ktalons/PCAPpuller/archive/refs/tags/${TAG}.tar.gz"
          # -f: a missing tag fails the step instead of silently pinning the sha256 of a 404 page.
          SHA=$(curl -fsSL --retry 3 "$URL" | sha256sum | awk '{print $1}')
          sed -i -E "s|^  url \".*\"|  url \"${URL}\"|" Formula/pcappuller.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Formula/pcappuller.rb
          git diff Formula/pcappuller.rb

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/pcappuller.rb
          git commit -m "pcappuller: formula ${{ github.event.inputs.tag || github.event.client_payload.tag }}" || exit 0
          # Update Cask and Update Formula both fire on the same release dispatch, so the
          # other one may have pushed first. Rebase onto origin/main and retry the push.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push && exit 0
            echo "push rejected (attempt ${attempt}), retrying"
            sleep $((attempt * 5))
          done
          echo "::error::git push failed after 3 attempts"
          exit 1
