name: Update Cask

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "PCAPpuller release tag (e.g. v0.4.0)"
        required: true
        type: string
  repository_dispatch:
    types: [pcappuller-release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump cask version and sha256
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.event.client_payload.tag }}"
          VERSION="${TAG#v}"
          URL="https://github.com/ktalons/PCAPpuller/releases/download/${TAG}/PCAPpullerGUI-macos.zip"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          sed -i -E "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/pcappuller.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/pcappuller.rb
          git diff Casks/pcappuller.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/pcappuller.rb
          git commit -m "pcappuller: cask ${{ github.event.inputs.tag || github.event.client_payload.tag }}" || exit 0
          git push
